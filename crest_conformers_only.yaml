# ============================================================================
# CREST Conformer Search Only
# ============================================================================
# Runs CREST conformer search with PM7 reoptimization but skips all
# downstream DFT calculations. Useful for generating conformer ensembles
# before deciding on a full workflow.
# ============================================================================

project:
  name: "crest_conformers"
  description: "CREST conformer search — no DFT calculations"
  output_dir: "conformer_run"
  xyz_dir: "xyz"

openbabel:
  module: null                  # Set if your cluster needs module load
  use_inchikey: true

conformer_search:
  enabled: true
  num_conformers: 10            # Keep more conformers for analysis
  backend: "crest"
  allow_fallback: true
  method: "PM7"
  rmsd_cutoff: 0.5
  use_rdkit: false
  rdkit_optimize: false
  crest:
    executable: "crest"
    xtb_executable: "xtb"
    gfn: "gfn2"
    solvent: null               # Add solvent: e.g. "water", "acetonitrile"
    threads: 16
    ewin: 6.0                   # kcal/mol energy window
    rthr: 0.125                 # Angstrom RMSD threshold
    ethr: 0.05                  # kcal/mol duplicate energy threshold
    mdlen: 20                   # ps MD length
    mddump: 100
    mdtemp: 300                 # K
    nci: false                  # Set true for non-covalent complexes
    entropy: false
    cbonds: []
    reoptimize_pm7: true
    gaussian_route: "#p PM7 opt"
  slurm:
    cores: 8
    memory: "32GB"
    time: "2-00:00:00"
    partition: "short"
  gaussian:
    route: "#p PM7 opt"
    charge: 0
    multiplicity: 1

# Only vacuum optimization — disable everything else
calculations:
  s0_opt_vac:
    enabled: true
    depends_on: null
    gaussian:
      route: "#p M06/6-31+G(d,p) opt int=ultrafine"
      charge: 0
      multiplicity: 1
      oldchk: null
    slurm:
      cores: 4
      memory: "8GB"
      time: "01:00:00"
      partition: "short"

slurm:
  gaussian_module: "gaussian/g16"
  gaussian_root: null
  scratch: "/scratch/$USER"
  email: "user@university.edu"
  mail_type: "END,FAIL"
  account: null
  constraint: null
  exclude_nodes: null
  max_concurrent_jobs: 50
  sbatch_cmd: "sbatch"

analysis:
  extract_energies: true
  extract_frequencies: false
  extract_orbitals: false
  generate_report: true
  compress_logs: false
  generate_fchk: false
