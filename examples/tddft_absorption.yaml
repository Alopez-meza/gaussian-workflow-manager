# ============================================================================
# TD-DFT Absorption Spectrum Workflow
# ============================================================================
# Ground state optimization in solvent followed by TD-DFT vertical
# excitations. Suitable for UV-Vis absorption spectrum prediction.
#
# RDKit conformer search (fast, no CREST/xTB dependency).
# ============================================================================

project:
  name: "tddft_absorption"
  description: "Opt + TD-DFT for UV-Vis absorption"
  output_dir: "tddft_run"
  xyz_dir: "xyz"

openbabel:
  module: null
  use_inchikey: true

conformer_search:
  enabled: true
  num_conformers: 3
  backend: "rdkit"
  allow_fallback: true
  method: "PM7"
  rmsd_cutoff: 0.5
  use_rdkit: true
  rdkit_optimize: true
  rdkit_max_iters: 500
  slurm:
    cores: 4
    memory: "8GB"
    time: "00:30:00"
    partition: "short"
  gaussian:
    route: "#p PM7 opt"
    charge: 0
    multiplicity: 1

calculations:
  # Vacuum optimization
  s0_opt_freq_vac:
    enabled: true
    depends_on: null
    gaussian:
      route: "#p M06/6-31+G(d,p) opt=(calcfc,maxcycles=250) freq=noraman int=ultrafine"
      charge: 0
      multiplicity: 1
      oldchk: null
    slurm:
      cores: 4
      memory: "8GB"
      time: "02:00:00"
      partition: "short"

  # Solvent optimization
  s0_opt_freq_solv:
    enabled: true
    depends_on: "s0_opt_freq_vac"
    gaussian:
      route: "#p M06/6-31+G(d,p) opt=(recalcfc=30,maxcycles=250) freq=noraman scrf=(iefpcm,solvent=acetonitrile) int=ultrafine"
      charge: 0
      multiplicity: 1
      oldchk: "s0_opt_freq_vac"
      geom: "AllCheck"
      guess: "Read"
    slurm:
      cores: 4
      memory: "8GB"
      time: "02:00:00"
      partition: "short"

  # TD-DFT single point — 20 excited states, 50-50 singlet-triplet
  s0_sp_tddft_solv:
    enabled: true
    depends_on: "s0_opt_freq_solv"
    gaussian:
      route: "#p M06/6-31+G(d,p) td=(50-50,nstates=20) scrf=(iefpcm,solvent=acetonitrile) int=ultrafine"
      charge: 0
      multiplicity: 1
      oldchk: "s0_opt_freq_solv"
      geom: "AllCheck"
      guess: "Read"
    slurm:
      cores: 4
      memory: "8GB"
      time: "02:00:00"
      partition: "short"

slurm:
  gaussian_module: "gaussian/g16"
  gaussian_root: null
  scratch: "/scratch/$USER"
  email: "user@university.edu"
  mail_type: "END,FAIL"
  account: null
  constraint: null
  exclude_nodes: null
  max_concurrent_jobs: 50
  sbatch_cmd: "sbatch"

analysis:
  extract_energies: true
  extract_frequencies: true
  extract_orbitals: true
  generate_report: true
  compress_logs: false
  generate_fchk: false
