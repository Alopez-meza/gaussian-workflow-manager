# ============================================================================
# Quick Test Workflow
# ============================================================================
# Minimal workflow for testing: semi-empirical PM6, short time limits,
# no conformer search. Use this to verify your cluster setup before
# running production calculations.
# ============================================================================

project:
  name: "quick_test"
  description: "Fast test run with PM6"
  output_dir: "test_run"
  xyz_dir: "xyz"

openbabel:
  module: null
  use_inchikey: false           # Use filenames directly for test

conformer_search:
  enabled: false

calculations:
  s0_opt_vac:
    enabled: true
    depends_on: null
    gaussian:
      route: "#p PM6 opt"
      charge: 0
      multiplicity: 1
      oldchk: null
    slurm:
      cores: 1
      memory: "2GB"
      time: "00:10:00"
      partition: "short"

  s0_opt_solv:
    enabled: true
    depends_on: "s0_opt_vac"
    gaussian:
      route: "#p PM6 opt scrf=(iefpcm,solvent=water)"
      charge: 0
      multiplicity: 1
      oldchk: "s0_opt_vac"
      geom: "AllCheck"
      guess: "Read"
    slurm:
      cores: 1
      memory: "2GB"
      time: "00:10:00"
      partition: "short"

slurm:
  gaussian_module: "gaussian/g16"   # Change to match your cluster
  gaussian_root: null
  scratch: "/scratch/$USER"
  email: "user@university.edu"
  mail_type: "END,FAIL"
  account: null
  constraint: null
  exclude_nodes: null
  max_concurrent_jobs: 10
  sbatch_cmd: "sbatch"

analysis:
  extract_energies: true
  extract_frequencies: false
  extract_orbitals: false
  generate_report: true
  compress_logs: false
  generate_fchk: false
