# ============================================================================
# Redox Potentials Workflow
# ============================================================================
# Ground state + radical cation (oxidation) + radical anion (reduction)
# in vacuum and solvent. For computing ionization potentials, electron
# affinities, and electrochemical redox potentials.
#
# No excited states, no TD-DFT. Conformer search disabled.
# ============================================================================

project:
  name: "redox_workflow"
  description: "Ground state + cation + anion for redox potentials"
  output_dir: "redox_run"
  xyz_dir: "xyz"

openbabel:
  module: null
  use_inchikey: true

conformer_search:
  enabled: false

calculations:
  # Neutral ground state — vacuum
  s0_opt_freq_vac:
    enabled: true
    depends_on: null
    gaussian:
      route: "#p M06/6-31+G(d,p) opt=(calcfc,maxcycles=250) freq=noraman int=ultrafine"
      charge: 0
      multiplicity: 1
      oldchk: null
    slurm:
      cores: 4
      memory: "8GB"
      time: "02:00:00"
      partition: "short"

  # Neutral ground state — solvent
  s0_opt_freq_solv:
    enabled: true
    depends_on: "s0_opt_freq_vac"
    gaussian:
      route: "#p M06/6-31+G(d,p) opt=(recalcfc=30,maxcycles=250) freq=noraman scrf=(iefpcm,solvent=acetonitrile) int=ultrafine"
      charge: 0
      multiplicity: 1
      oldchk: "s0_opt_freq_vac"
      geom: "AllCheck"
      guess: "Read"
    slurm:
      cores: 4
      memory: "8GB"
      time: "02:00:00"
      partition: "short"

  # Radical cation — vacuum
  cat_opt_freq_vac:
    enabled: true
    depends_on: "s0_opt_freq_vac"
    gaussian:
      route: "#p UM06/6-31+G(d,p) opt=(calcfc,maxcycles=250) freq=noraman scf=(xqc,maxcycle=512) int=ultrafine"
      charge: 1
      multiplicity: 2
      oldchk: "s0_opt_freq_vac"
      geom: "AllCheck"
      guess: "Read"
    slurm:
      cores: 4
      memory: "8GB"
      time: "02:00:00"
      partition: "short"

  # Radical cation — solvent
  cat_opt_freq_solv:
    enabled: true
    depends_on: "cat_opt_freq_vac"
    gaussian:
      route: "#p UM06/6-31+G(d,p) opt=(recalcfc=30,maxcycles=250) freq=noraman scrf=(iefpcm,solvent=acetonitrile) scf=(xqc,maxcycle=512) int=ultrafine"
      charge: 1
      multiplicity: 2
      oldchk: "cat_opt_freq_vac"
      geom: "AllCheck"
      guess: "Read"
    slurm:
      cores: 4
      memory: "8GB"
      time: "02:00:00"
      partition: "short"

  # Radical anion — solvent
  an_opt_freq_solv:
    enabled: true
    depends_on: "s0_opt_freq_vac"
    gaussian:
      route: "#p UM06/6-31+G(d,p) opt=(calcfc,maxcycles=250) freq=noraman scrf=(iefpcm,solvent=acetonitrile) scf=(xqc,maxcycle=512,conver=6) int=ultrafine"
      charge: -1
      multiplicity: 2
      oldchk: "s0_opt_freq_vac"
      geom: "AllCheck"
      guess: "Read"
    slurm:
      cores: 4
      memory: "8GB"
      time: "02:00:00"
      partition: "short"

slurm:
  gaussian_module: "gaussian/g16"
  gaussian_root: null
  scratch: "/scratch/$USER"
  email: "user@university.edu"
  mail_type: "END,FAIL"
  account: null
  constraint: null
  exclude_nodes: null
  max_concurrent_jobs: 50
  sbatch_cmd: "sbatch"

analysis:
  extract_energies: true
  extract_frequencies: true
  extract_orbitals: true
  generate_report: true
  compress_logs: false
  generate_fchk: true
