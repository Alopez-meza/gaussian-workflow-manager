# ============================================================================
# Basic Optimization + Frequency Workflow
# ============================================================================
# Ground state optimization in vacuum and solvent, with frequency analysis.
# No excited states, no redox. Good starting point for benchmarking or
# thermochemistry studies.
#
# Conformer search disabled — uses input geometries directly.
# ============================================================================

project:
  name: "opt_freq_workflow"
  description: "Ground state opt + freq in vacuum and solvent"
  output_dir: "opt_freq_run"
  xyz_dir: "xyz"

openbabel:
  module: null
  use_inchikey: true

conformer_search:
  enabled: false

calculations:
  # Vacuum optimization + frequency
  s0_opt_freq_vac:
    enabled: true
    depends_on: null
    gaussian:
      route: "#p B3LYP/6-31G(d) opt=(calcfc,maxcycles=250) freq int=ultrafine"
      charge: 0
      multiplicity: 1
      oldchk: null
    slurm:
      cores: 4
      memory: "8GB"
      time: "01:00:00"
      partition: "short"

  # Solvent optimization + frequency (reads geometry from vacuum)
  s0_opt_freq_solv:
    enabled: true
    depends_on: "s0_opt_freq_vac"
    gaussian:
      route: "#p B3LYP/6-31G(d) opt=(recalcfc=30,maxcycles=250) freq scrf=(iefpcm,solvent=water) int=ultrafine"
      charge: 0
      multiplicity: 1
      oldchk: "s0_opt_freq_vac"
      geom: "AllCheck"
      guess: "Read"
    slurm:
      cores: 4
      memory: "8GB"
      time: "01:00:00"
      partition: "short"

slurm:
  gaussian_module: "gaussian/g16"
  gaussian_root: null
  scratch: "/scratch/$USER"
  email: "user@university.edu"
  mail_type: "END,FAIL"
  account: null
  constraint: null
  exclude_nodes: null
  max_concurrent_jobs: 50
  sbatch_cmd: "sbatch"

analysis:
  extract_energies: true
  extract_frequencies: true
  extract_orbitals: true
  generate_report: true
  compress_logs: false
  generate_fchk: false
